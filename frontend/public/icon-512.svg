<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Fundo Azul Noturno Comunicar -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Gradiente Amarelo Ouro Comunicar Marketing -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Brilho Dourado -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados PWA -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Anel circular externo -->
  <circle cx="256" cy="230" r="140" stroke="url(#gold)" stroke-width="12" fill="#070d1e" filter="url(#glow)" opacity="0.95"/>

  <!-- Ondas NFC sutis no topo do anel -->
  <path d="M216 120C228 112 242 108 256 108C270 108 284 112 296 120" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M200 102C216 92 235 86 256 86C277 86 296 92 312 102" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Gráfico de barras ascendente branco (Identidade Oficial Comunicar Marketing) -->
  <!-- Barra 1 (Esquerda) -->
  <rect x="180" y="240" width="28" height="60" rx="8" fill="#ffffff"/>
  <!-- Barra 2 (Centro) -->
  <rect x="224" y="200" width="28" height="100" rx="8" fill="#ffffff"/>
  <!-- Barra 3 (Direita) -->
  <rect x="268" y="160" width="28" height="140" rx="8" fill="#ffffff"/>

  <!-- Seta Ascendente Dourada Oficial (Crescimento de Resultados) -->
  <path d="M165 245 L245 185 L290 220 L355 135" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Ponta da seta -->
  <polygon points="365,120 330,135 348,155" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Linha de base da logo -->
  <line x1="165" y1="312" x2="335" y2="312" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round"/>

  <!-- Tipografia Oficial da Marca -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMUNICAR</text>
  <text x="256" y="456" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="8">MARKETING</text>
</svg>
