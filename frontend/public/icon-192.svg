  </defs>

  <rect width="192" height="192" rx="48" fill="url(#bg)"/>
  <circle cx="96" cy="85" r="54" stroke="url(#gold)" stroke-width="5" fill="#070d1e"/>

  <!-- Barras brancas -->
  <rect x="67" y="88" width="11" height="24" rx="3" fill="#ffffff"/>
  <rect x="84" y="73" width="11" height="39" rx="3" fill="#ffffff"/>
  <rect x="101" y="58" width="11" height="54" rx="3" fill="#ffffff"/>

